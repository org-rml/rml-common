name: Publish rml-common to Nexus

on:
  push:
    branches:
      - main
    paths:
      - '**'
  release:
    types: [created]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings (Nexus credentials)
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          servers: >
            [
              {
                "id": "nexus-releases",
                "username": "${{ secrets.NEXUS_USER }}",
                "password": "${{ secrets.NEXUS_PASSWORD }}"
              },
              {
                "id": "nexus-snapshots",
                "username": "${{ secrets.NEXUS_USER }}",
                "password": "${{ secrets.NEXUS_PASSWORD }}"
              }
            ]

      - name: Build
        run: mvn --batch-mode clean verify -DskipTests

      - name: Publish to Nexus
        run: mvn --batch-mode deploy -DskipTests -Dnexus.url=${{ secrets.NEXUS_URL }}
